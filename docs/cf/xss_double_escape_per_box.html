<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>XSS 이스케이프 다중 처리 (박스당 1회 · 2행)</title>
<style>
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #fafaf7; padding: 28px 24px; margin: 0; }
  .wrap { max-width: 760px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  h1 { font-size: 15px; font-weight: 500; text-align: center; margin: 0 0 14px; color: #0f172a; }
</style>
</head>
<body>
<div class="wrap">
<h1>XSS 이스케이프 다중 처리 — 주문 조회 (2행 레이아웃)</h1>

<svg width="100%" viewBox="0 0 620 185" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="xss-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="xss-shadow-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="xss-grad-neutral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="xss-grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="xss-grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef2f2"/>
      <stop offset="1" stop-color="#fecaca"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ROW 1 (left → right) -->
  <rect x="10" y="20" width="92" height="50" rx="10" fill="url(#xss-grad-neutral)" stroke="#475569" stroke-width="1.2" filter="url(#xss-shadow)"/>
  <text x="20" y="38" font-size="11" font-weight="600" fill="#0f172a">원본 입력</text>
  <line x1="20" y1="44" x2="92" y2="44" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="20" y="62" font-size="10" fill="#334155">"노트북 &amp; 모니터"</text>

  <line x1="102" y1="45" x2="118" y2="45" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="118" y="20" width="125" height="50" rx="10" fill="url(#xss-grad-accent)" stroke="#4f46e5" stroke-width="1.2" filter="url(#xss-shadow)"/>
  <text x="128" y="38" font-size="11" font-weight="600" fill="#3730a3">관리자 API · filter</text>
  <line x1="128" y1="44" x2="233" y2="44" stroke="#c7d2fe" stroke-width="0.5"/>
  <text x="128" y="62" font-size="10" fill="#334155">"노트북 &amp;amp; 모니터"</text>

  <line x1="243" y1="45" x2="253" y2="45" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="253" y="20" width="148" height="50" rx="10" fill="url(#xss-grad-accent)" stroke="#4f46e5" stroke-width="1.2" filter="url(#xss-shadow)"/>
  <text x="263" y="38" font-size="11" font-weight="600" fill="#3730a3">관리자 API · controller</text>
  <line x1="263" y1="44" x2="391" y2="44" stroke="#c7d2fe" stroke-width="0.5"/>
  <text x="263" y="62" font-size="10" fill="#334155">"노트북 &amp;amp;amp; 모니터"</text>

  <!-- Connector: row1 admin·c right edge → row2 order·f top-center -->
  <path d="M 401 45 H 525 V 110" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ROW 2 (right → left) -->
  <rect x="444" y="110" width="162" height="50" rx="10" fill="url(#xss-grad-accent)" stroke="#4f46e5" stroke-width="1.2" filter="url(#xss-shadow)"/>
  <text x="454" y="128" font-size="11" font-weight="600" fill="#3730a3">주문 API · filter</text>
  <line x1="454" y1="134" x2="596" y2="134" stroke="#c7d2fe" stroke-width="0.5"/>
  <text x="454" y="152" font-size="10" fill="#334155">"노트북 &amp;amp;amp;amp; 모니터"</text>

  <line x1="444" y1="135" x2="428" y2="135" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="246" y="110" width="182" height="50" rx="10" fill="url(#xss-grad-accent)" stroke="#4f46e5" stroke-width="1.2" filter="url(#xss-shadow)"/>
  <text x="256" y="128" font-size="11" font-weight="600" fill="#3730a3">배송 API · filter</text>
  <line x1="256" y1="134" x2="418" y2="134" stroke="#c7d2fe" stroke-width="0.5"/>
  <text x="256" y="152" font-size="10" fill="#334155">"노트북 &amp;amp;amp;amp;amp; 모니터"</text>

  <line x1="246" y1="135" x2="230" y2="135" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="10" y="95" width="220" height="80" rx="12" fill="url(#xss-grad-warn)" stroke="#dc2626" stroke-width="1.4" filter="url(#xss-shadow-strong)"/>
  <text x="20" y="112" font-size="11" font-weight="700" fill="#991b1b">최종 화면</text>
  <line x1="20" y1="119" x2="220" y2="119" stroke="#fecaca" stroke-width="0.5"/>
  <text x="20" y="141" font-size="10" fill="#475569">의도<tspan x="45" fill="#475569">"노트북 &amp; 모니터"</tspan></text>
  <text x="20" y="161" font-size="10" font-weight="600" fill="#991b1b">실제<tspan x="45" fill="#991b1b">"노트북 &amp;amp;amp;amp;amp; 모니터"</tspan></text>
</svg>

</div>
</body>
</html>
