<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>현금영수증 부분취소 동시성 시나리오 (세로 흐름)</title>
<style>
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #fafaf7; padding: 24px; margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  h1 { font-size: 18px; font-weight: 500; text-align: center; margin: 0 0 20px; color: #2C2C2A; }
  .legend { font-size: 13px; color: #5F5E5A; margin-top: 16px; padding: 12px 16px; background: #FAEEDA; border-left: 3px solid #D85A30; border-radius: 4px; }
  .legend strong { color: #854F0B; }
</style>
</head>
<body>
<div class="wrap">
<h1>벤더사의 연속 취소 API 호출로 발생하는 부분 취소 동시성 시나리오 (세로 흐름)</h1>

<svg width="100%" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- 통합 박스: 취소(레드) → 발급(그린) 흐름 그라데이션 -->
    <linearGradient id="flow-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <!-- ============== 상단 셋업 영역 ============== -->

  <!-- 주문 완료 -->
  <rect x="40" y="60" width="180" height="120" rx="10" fill="#F1EFE8" stroke="#444441" stroke-width="1"/>
  <text x="130" y="90" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">주문 완료</text>
  <line x1="60" y1="100" x2="200" y2="100" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="130" y="125" text-anchor="middle" font-size="12" fill="#444441">1, 2, 3번 상품</text>
  <text x="130" y="143" text-anchor="middle" font-size="12" fill="#444441">주문 완료</text>
  <text x="130" y="167" text-anchor="middle" font-size="12" fill="#444441">현금영수증(5341) 발행</text>

  <!-- 주문완료 → 벤더사 화살표 -->
  <line x1="220" y1="120" x2="260" y2="120" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 벤더사 -->
  <rect x="265" y="80" width="100" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="315" y="115" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">벤더사</text>
  <text x="315" y="135" text-anchor="middle" font-size="11" fill="#185FA5">(서버)</text>

  <!-- 벤더사 → RabbitMQ : 3개의 취소 API 호출 -->
  <text x="430" y="80" text-anchor="middle" font-size="11" fill="#185FA5">상품 1번 취소 API 호출</text>
  <line x1="365" y1="90" x2="495" y2="90" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="430" y="115" text-anchor="middle" font-size="11" fill="#185FA5">상품 2번 취소 API 호출</text>
  <line x1="365" y1="125" x2="495" y2="125" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="430" y="150" text-anchor="middle" font-size="11" fill="#185FA5">상품 3번 취소 API 호출</text>
  <line x1="365" y1="160" x2="495" y2="160" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- RabbitMQ -->
  <rect x="500" y="65" width="120" height="115" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="560" y="115" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">RabbitMQ</text>
  <text x="560" y="135" text-anchor="middle" font-size="11" fill="#854F0B">(MQ)</text>

  <!-- ★ 핵심: RabbitMQ 하단 변 가운데(560, 180)에서 출발하는 3개 분배 라인 -->
  <circle cx="560" cy="180" r="4" fill="#D85A30"/>
  <path d="M 560 180 L 250 280" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 560 180 L 560 280" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 560 180 L 870 280" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Consumer 서버들 (가로 행) -->
  <rect x="190" y="285" width="120" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="250" y="315" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Consumer1</text>
  <text x="250" y="335" text-anchor="middle" font-size="11" fill="#0F6E56">(서버)</text>

  <rect x="500" y="285" width="120" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="560" y="315" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Consumer2</text>
  <text x="560" y="335" text-anchor="middle" font-size="11" fill="#185FA5">(서버)</text>

  <rect x="810" y="285" width="120" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="870" y="315" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Consumer3</text>
  <text x="870" y="335" text-anchor="middle" font-size="11" fill="#534AB7">(서버)</text>

  <!-- ============== 시간 축 (왼쪽 세로) ============== -->
  <text x="50" y="395" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">시간 ↓</text>
  <line x1="50" y1="405" x2="50" y2="990" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 시간 마커 + 가로 가이드 라인 -->
  <circle cx="50" cy="410" r="4" fill="#A32D2D"/>
  <text x="80" y="415" font-size="12" font-weight="500" fill="#791F1F">t = 0s</text>
  <line x1="120" y1="410" x2="1040" y2="410" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.4"/>

  <circle cx="50" cy="540" r="4" fill="#3B6D11"/>
  <text x="80" y="545" font-size="12" font-weight="500" fill="#27500A">t = 1s</text>
  <line x1="120" y1="540" x2="1040" y2="540" stroke="#3B6D11" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.4"/>

  <circle cx="50" cy="680" r="4" fill="#185FA5"/>
  <text x="80" y="685" font-size="12" font-weight="500" fill="#0C447C">t = 2s</text>
  <line x1="120" y1="680" x2="1040" y2="680" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.4"/>

  <circle cx="50" cy="780" r="4" fill="#534AB7"/>
  <text x="80" y="785" font-size="12" font-weight="500" fill="#3C3489">t = 2.2s</text>
  <line x1="120" y1="780" x2="1040" y2="780" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.4"/>

  <circle cx="50" cy="880" r="4" fill="#185FA5"/>
  <text x="80" y="885" font-size="12" font-weight="500" fill="#0C447C">t = 2.5s</text>
  <line x1="120" y1="880" x2="1040" y2="880" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.4"/>

  <!-- ============== Consumer1 이벤트들 ============== -->

  <!-- Consumer1 서버에서 t=0s 박스로 -->
  <line x1="250" y1="355" x2="250" y2="410" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Consumer1: 취소(t=0s) → 발급(t=2.5s선) 통합 박스 · 결제금액 계산을 Consumer2와 동일 선상으로 정렬 -->
  <rect x="140" y="410" width="220" height="560" rx="8" fill="url(#flow-grad)" stroke="#5F5E5A" stroke-width="1"/>
  <circle cx="160" cy="430" r="6" fill="#A32D2D"/>
  <line x1="156" y1="426" x2="164" y2="434" stroke="white" stroke-width="1.5"/>
  <line x1="164" y1="426" x2="156" y2="434" stroke="white" stroke-width="1.5"/>
  <text x="265" y="438" text-anchor="middle" font-size="12" fill="#791F1F">상품 1번 취소요청 입력</text>
  <text x="265" y="465" text-anchor="middle" font-size="12" fill="#791F1F">현금영수증(5341)</text>
  <text x="265" y="483" text-anchor="middle" font-size="12" fill="#791F1F">발행금액 전체취소</text>

  <!-- 취소→발급 내부 연결 화살표 -->
  <line x1="250" y1="500" x2="250" y2="888" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="160" cy="900" r="6" fill="#3B6D11"/>
  <path d="M 156 900 L 159 903 L 164 898" stroke="white" stroke-width="1.5" fill="none"/>
  <text x="265" y="908" text-anchor="middle" font-size="12" fill="#27500A">상품 1번을 제외한</text>
  <text x="265" y="935" text-anchor="middle" font-size="12" fill="#27500A">결제금액 계산</text>
  <text x="265" y="953" text-anchor="middle" font-size="12" fill="#27500A">현금영수증(5342) 발급</text>

  <!-- ============== Consumer2 이벤트들 ============== -->

  <!-- Consumer2 서버에서 t=2s 박스로 (긴 대기 라인) -->
  <line x1="560" y1="355" x2="560" y2="680" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="560" y1="678" x2="560" y2="680" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Consumer2: 취소(t=2s) → 발급(t=2.5s) 통합 박스 -->
  <rect x="450" y="680" width="220" height="290" rx="8" fill="url(#flow-grad)" stroke="#5F5E5A" stroke-width="1"/>
  <circle cx="470" cy="700" r="6" fill="#A32D2D"/>
  <line x1="466" y1="696" x2="474" y2="704" stroke="white" stroke-width="1.5"/>
  <line x1="474" y1="696" x2="466" y2="704" stroke="white" stroke-width="1.5"/>
  <text x="575" y="708" text-anchor="middle" font-size="12" fill="#791F1F">상품 2번 취소요청 입력</text>
  <text x="572" y="735" text-anchor="middle" font-size="12" fill="#791F1F">직전 현금영수증(5342)</text>
  <text x="572" y="753" text-anchor="middle" font-size="12" fill="#791F1F">발행금액 전체취소</text>

  <!-- 취소→발급 내부 연결 화살표 -->
  <line x1="560" y1="775" x2="560" y2="875" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="470" cy="900" r="6" fill="#3B6D11"/>
  <path d="M 466 900 L 469 903 L 474 898" stroke="white" stroke-width="1.5" fill="none"/>
  <text x="572" y="908" text-anchor="middle" font-size="12" fill="#27500A">상품 1, 2번을 제외한</text>
  <text x="572" y="935" text-anchor="middle" font-size="12" fill="#27500A">결제금액 계산</text>
  <text x="572" y="953" text-anchor="middle" font-size="12" fill="#27500A">현금영수증(5343) 발급</text>

  <!-- ============== Consumer3 이벤트들 ============== -->

  <!-- Consumer3 서버에서 t=2.2s 박스로 (긴 대기 라인) -->
  <line x1="870" y1="355" x2="870" y2="780" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="870" y1="778" x2="870" y2="780" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Consumer3: t=2.2s (red) -->
  <rect x="760" y="780" width="220" height="90" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <circle cx="780" cy="800" r="6" fill="#A32D2D"/>
  <line x1="776" y1="796" x2="784" y2="804" stroke="white" stroke-width="1.5"/>
  <line x1="784" y1="796" x2="776" y2="804" stroke="white" stroke-width="1.5"/>
  <text x="884" y="808" text-anchor="middle" font-size="12" fill="#791F1F">상품 3번 취소요청 입력</text>
  <text x="881" y="835" text-anchor="middle" font-size="12" fill="#791F1F">직전 현금영수증(5342)</text>
  <text x="881" y="853" text-anchor="middle" font-size="12" fill="#791F1F">발행금액 전체취소</text>

  <!-- 경합 발생 (race condition) 점선 화살표: Consumer2 t=2s 박스 → Consumer3 t=2.2s 박스 -->
  <path d="M 670 725 L 715 725 L 715 825 L 760 825" fill="none" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="725" y="780" font-size="11" font-style="italic" fill="#A32D2D" font-weight="500">동일 5342 경합</text>

  <!-- 결제금액 계산 경합 (Consumer1·Consumer2 동일 선상 계산 쿼리 경합) -->
  <line x1="360" y1="935" x2="450" y2="935" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="405" y1="994" x2="405" y2="940" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="405" y="1012" text-anchor="middle" font-size="12" font-style="italic" fill="#A32D2D" font-weight="600">결제금액 계산 경합</text>

  <!-- 오류 메시지 -->
  <line x1="870" y1="870" x2="870" y2="990" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="730" y="995" width="280" height="50" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <polygon points="755,1025 770,1025 762.5,1010" fill="#A32D2D"/>
  <text x="762.5" y="1028" text-anchor="middle" font-size="11" font-weight="500" fill="white">!</text>
  <text x="892" y="1025" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">이미 기처리된 요청입니다 오류</text>

</svg>

<div class="legend">
  <strong>세로 흐름 변경 사항:</strong>
  시간 축이 왼쪽에서 위에서 아래로 진행합니다.
  RabbitMQ는 <strong>하단 변 가운데(주황색 점)</strong>에서 세 라인이 모두 출발하여 Consumer1·2·3로 분배되고,
  각 Consumer의 처리는 자신의 컬럼에서 시간순으로 아래로 쌓입니다.
  Consumer2의 t=2s 처리 중에 Consumer3가 같은 5342 영수증을 건드려 경합이 발생하는 흐름이 점선 화살표로 강조됩니다.
</div>
</div>
</body>
</html>
