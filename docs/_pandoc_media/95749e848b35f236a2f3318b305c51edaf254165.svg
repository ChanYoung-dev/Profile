<svg width="100%" viewbox="0 0 620 135" preserveaspectratio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <filter id="of-shadow" x="-20%" y="-20%" width="140%" height="140%">
                      <fedropshadow dx="0" dy="2" stddeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"></fedropshadow>
                    </filter>
                    <filter id="of-shadow-strong" x="-20%" y="-20%" width="140%" height="140%">
                      <fedropshadow dx="0" dy="3" stddeviation="4" flood-color="#0f172a" flood-opacity="0.16"></fedropshadow>
                    </filter>
                    <lineargradient id="of-grad-neutral" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#ffffff"></stop>
                      <stop offset="1" stop-color="#e2e8f0"></stop>
                    </lineargradient>
                    <lineargradient id="of-grad-warn" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#fef2f2"></stop>
                      <stop offset="1" stop-color="#fecaca"></stop>
                    </lineargradient>
                    <lineargradient id="of-grad-success" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#ecfdf5"></stop>
                      <stop offset="1" stop-color="#a7f3d0"></stop>
                    </lineargradient>
                    <marker id="of-arrow" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse">
                      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </marker>
                    <marker id="of-arrow-pierce" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="10" markerheight="10" orient="auto-start-reverse">
                      <path d="M1.5 0.5L9 5L1.5 9.5" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
                    </marker>
                  </defs>

                  <!-- 주문 API 컨테이너 — 메인 4개 박스를 감싸는 서비스 경계 -->
                  <rect x="5" y="65" width="610" height="68" rx="14" fill="rgba(238, 242, 255, 0.35)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" />
                  <!-- 컨테이너 라벨 핀 (좌상단, 경계 위로 살짝 걸침) -->
                  <rect x="18" y="56" width="68" height="18" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2" />
                  <text x="52" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3" letter-spacing="0.5">주문 API</text>

                  <!-- 메인 흐름 (y=75~125, 중심 y=100) -->
                  <!-- 주문 요청 인입 (neutral) -->
                  <rect x="10" y="75" width="85" height="50" rx="10" fill="url(#of-grad-neutral)" stroke="#475569" stroke-width="1.2" filter="url(#of-shadow)" />
                  <text x="52.5" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">주문 요청 인입</text>

                  <line x1="95" y1="100" x2="111" y2="100" stroke="#475569" stroke-width="1.2" marker-end="url(#of-arrow)"></line>

                  <!-- 주문 검증 · 재고 확인 (neutral) -->
                  <rect x="111" y="75" width="115" height="50" rx="10" fill="url(#of-grad-neutral)" stroke="#475569" stroke-width="1.2" filter="url(#of-shadow)" />
                  <text x="168.5" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">주문 검증 · 재고 확인</text>

                  <!-- 메인 라인 점선 (검증 → 저장 사이의 잠재 경로 — 외부 MSA로 이탈됨) -->
                  <line x1="226" y1="100" x2="393" y2="100" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"></line>

                  <!-- 주문 저장 · 결제 확정 (neutral) -->
                  <rect x="393" y="75" width="125" height="50" rx="10" fill="url(#of-grad-neutral)" stroke="#475569" stroke-width="1.2" filter="url(#of-shadow)" />
                  <text x="455.5" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">주문 저장 · 결제 확정</text>

                  <line x1="518" y1="100" x2="534" y2="100" stroke="#475569" stroke-width="1.2" marker-end="url(#of-arrow)"></line>

                  <!-- 주문 완료 (success) -->
                  <rect x="534" y="75" width="76" height="50" rx="10" fill="url(#of-grad-success)" stroke="#059669" stroke-width="1.4" filter="url(#of-shadow)" />
                  <text x="572" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">주문 완료</text>

                  <!-- 위로 이탈한 포인트 API · 차감 (외부 MSA, y=5~55) -->
                  <rect x="240" y="5" width="140" height="50" rx="10" fill="url(#of-grad-warn)" stroke="#dc2626" stroke-width="1.4" filter="url(#of-shadow-strong)" />
                  <text x="310" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">포인트 API · 차감</text>
                  <text x="310" y="42" text-anchor="middle" font-size="8" fill="#dc2626">HTTP POST · 외부 MSA</text>

                  <!-- UP 화살표 — 주문 검증에서 위로 솟아 포인트 API 좌측 변 진입 (검정 보통 굵기) -->
                  <path d="M 228 84 C 230 60 232 38 264 35" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" marker-end="url(#of-arrow)" />

                  <!-- DOWN 화살표 — 포인트 API 우측 변에서 다시 메인 흐름(주문 저장)으로 복귀 -->
                  <path d="M 380 35 C 388 50 392 70 392 90" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="0" marker-end="url(#of-arrow)" />
                </svg>