<svg width="100%" viewbox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="벤더사의 연속 취소 API 호출로 발생하는 부분 취소 동시성 시나리오">
                  <defs>
                    <!-- Drop shadow filters for 3D depth -->
                    <filter id="cf-shadow" x="-20%" y="-20%" width="140%" height="140%">
                      <fedropshadow dx="0" dy="3" stddeviation="4" flood-color="#0f172a" flood-opacity="0.10"></fedropshadow>
                    </filter>
                    <filter id="cf-shadow-strong" x="-20%" y="-20%" width="140%" height="140%">
                      <fedropshadow dx="0" dy="4" stddeviation="6" flood-color="#0f172a" flood-opacity="0.16"></fedropshadow>
                    </filter>

                    <!-- Unified gradient palette: neutral / accent / warn / success -->
                    <lineargradient id="cf-grad-neutral" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#ffffff"></stop>
                      <stop offset="1" stop-color="#e2e8f0"></stop>
                    </lineargradient>
                    <lineargradient id="cf-grad-accent" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#eef2ff"></stop>
                      <stop offset="1" stop-color="#c7d2fe"></stop>
                    </lineargradient>
                    <lineargradient id="cf-grad-warn" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#fef2f2"></stop>
                      <stop offset="1" stop-color="#fecaca"></stop>
                    </lineargradient>
                    <lineargradient id="cf-grad-success" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#ecfdf5"></stop>
                      <stop offset="1" stop-color="#a7f3d0"></stop>
                    </lineargradient>
                    <lineargradient id="cf-grad-conflict" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#fef3c7"></stop>
                      <stop offset="1" stop-color="#fcd34d"></stop>
                    </lineargradient>

                    <marker id="cf-arrow" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse">
                      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </marker>
                    <marker id="cf-arrow-red" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse">
                      <path d="M2 1L8 5L2 9" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </marker>
                  </defs>

                  <!-- 주문 완료 (neutral) -->
                  <rect x="40" y="60" width="180" height="120" rx="14" fill="url(#cf-grad-neutral)" stroke="#475569" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <text x="130" y="90" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">주문 완료</text>
                  <line x1="60" y1="100" x2="200" y2="100" stroke="#cbd5e1" stroke-width="0.6"></line>
                  <text x="130" y="125" text-anchor="middle" font-size="15" fill="#334155">1, 2, 3번 상품</text>
                  <text x="130" y="143" text-anchor="middle" font-size="15" fill="#334155">주문 완료</text>
                  <text x="130" y="167" text-anchor="middle" font-size="15" fill="#334155">현금영수증(5341) 발행</text>

                  <line x1="220" y1="135" x2="255" y2="135" stroke="#475569" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>

                  <!-- 벤더사 (neutral) -->
                  <rect x="255" y="65" width="130" height="140" rx="14" fill="url(#cf-grad-neutral)" stroke="#475569" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <image href="docs/image/vender.png" x="280" y="75" width="80" height="80" preserveaspectratio="xMidYMid meet"></image>
                  <text x="320" y="180" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">벤더사</text>
                  <text x="320" y="198" text-anchor="middle" font-size="13" fill="#475569">(서버)</text>

                  <!-- 벤더사 → RabbitMQ 취소 API 호출 (accent) -->
                  <text x="440" y="85" text-anchor="middle" font-size="13" fill="#4338ca">상품 1번 취소 API</text>
                  <line x1="385" y1="95" x2="495" y2="95" stroke="#6366f1" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>
                  <text x="440" y="125" text-anchor="middle" font-size="13" fill="#4338ca">상품 2번 취소 API</text>
                  <line x1="385" y1="135" x2="495" y2="135" stroke="#6366f1" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>
                  <text x="440" y="165" text-anchor="middle" font-size="13" fill="#4338ca">상품 3번 취소 API</text>
                  <line x1="385" y1="175" x2="495" y2="175" stroke="#6366f1" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>

                  <!-- RabbitMQ (accent) -->
                  <rect x="500" y="65" width="120" height="115" rx="14" fill="url(#cf-grad-accent)" stroke="#4f46e5" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <image href="docs/image/rabbit.png" x="538" y="80" width="44" height="44" preserveaspectratio="xMidYMid meet"></image>
                  <text x="560" y="148" text-anchor="middle" font-size="17" font-weight="600" fill="#3730a3">RabbitMQ</text>

                  <circle cx="560" cy="180" r="4" fill="#4f46e5"></circle>
                  <path d="M 560 180 L 250 280" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#cf-arrow)" />
                  <path d="M 560 180 L 560 280" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#cf-arrow)" />
                  <path d="M 560 180 L 870 280" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#cf-arrow)" />

                  <!-- Consumer 서버들 (모두 동일 accent로 통일) -->
                  <rect x="150" y="285" width="200" height="90" rx="14" fill="url(#cf-grad-accent)" stroke="#4f46e5" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <image href="docs/image/server.png" x="160" y="295" width="70" height="70" preserveaspectratio="xMidYMid meet"></image>
                  <text x="290" y="320" text-anchor="middle" font-size="17" font-weight="600" fill="#3730a3">Consumer1</text>
                  <text x="290" y="348" text-anchor="middle" font-size="14" fill="#4f46e5">(상품1번 취소)</text>

                  <rect x="460" y="285" width="200" height="90" rx="14" fill="url(#cf-grad-accent)" stroke="#4f46e5" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <image href="docs/image/server.png" x="470" y="295" width="70" height="70" preserveaspectratio="xMidYMid meet"></image>
                  <text x="600" y="320" text-anchor="middle" font-size="17" font-weight="600" fill="#3730a3">Consumer2</text>
                  <text x="600" y="348" text-anchor="middle" font-size="14" fill="#4f46e5">(상품2번 취소)</text>

                  <rect x="770" y="285" width="200" height="90" rx="14" fill="url(#cf-grad-accent)" stroke="#4f46e5" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <image href="docs/image/server.png" x="780" y="295" width="70" height="70" preserveaspectratio="xMidYMid meet"></image>
                  <text x="910" y="320" text-anchor="middle" font-size="17" font-weight="600" fill="#3730a3">Consumer3</text>
                  <text x="910" y="348" text-anchor="middle" font-size="14" fill="#4f46e5">(상품3번 취소)</text>

                  <!-- 시간 축 (모두 중립 슬레이트 톤으로 통일) -->
                  <text x="50" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">시간 ↓</text>
                  <line x1="50" y1="405" x2="50" y2="990" stroke="#475569" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>

                  <circle cx="50" cy="410" r="4" fill="#475569"></circle>
                  <text x="80" y="415" font-size="15" font-weight="600" fill="#334155">t = 0s</text>
                  <line x1="120" y1="410" x2="1040" y2="410" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.5"></line>

                  <circle cx="50" cy="540" r="4" fill="#475569"></circle>
                  <text x="80" y="545" font-size="15" font-weight="600" fill="#334155">t = 1s</text>
                  <line x1="120" y1="540" x2="1040" y2="540" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.5"></line>

                  <circle cx="50" cy="680" r="4" fill="#475569"></circle>
                  <text x="80" y="685" font-size="15" font-weight="600" fill="#334155">t = 2s</text>
                  <line x1="120" y1="680" x2="1040" y2="680" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.5"></line>

                  <circle cx="50" cy="780" r="4" fill="#475569"></circle>
                  <text x="80" y="785" font-size="15" font-weight="600" fill="#334155">t = 2.2s</text>
                  <line x1="120" y1="780" x2="1040" y2="780" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.5"></line>

                  <circle cx="50" cy="880" r="4" fill="#475569"></circle>
                  <text x="80" y="885" font-size="15" font-weight="600" fill="#334155">t = 2.5s</text>
                  <line x1="120" y1="880" x2="1040" y2="880" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.5"></line>

                  <!-- Consumer1 이벤트 -->
                  <line x1="250" y1="375" x2="250" y2="410" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>
                  <rect x="140" y="410" width="220" height="90" rx="14" fill="url(#cf-grad-warn)" stroke="#dc2626" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <circle cx="160" cy="430" r="6" fill="#dc2626"></circle>
                  <line x1="156" y1="426" x2="164" y2="434" stroke="white" stroke-width="1.5"></line>
                  <line x1="164" y1="426" x2="156" y2="434" stroke="white" stroke-width="1.5"></line>
                  <text x="265" y="438" text-anchor="middle" font-size="15" fill="#991b1b">상품 1번 취소요청 입력</text>
                  <text x="265" y="465" text-anchor="middle" font-size="15" fill="#991b1b">현금영수증(5341)</text>
                  <text x="265" y="483" text-anchor="middle" font-size="15" fill="#991b1b">취소</text>

                  <line x1="250" y1="500" x2="250" y2="540" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>
                  <rect x="140" y="540" width="220" height="90" rx="14" fill="url(#cf-grad-success)" stroke="#059669" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <circle cx="160" cy="560" r="6" fill="#059669"></circle>
                  <path d="M 156 560 L 159 563 L 164 558" stroke="white" stroke-width="1.5" fill="none" />
                  <text x="265" y="568" text-anchor="middle" font-size="15" fill="#065f46">상품 1번을 제외한</text>
                  <text x="265" y="586" text-anchor="middle" font-size="15" fill="#065f46">나머지 금액 발급</text>
                  <text x="265" y="610" text-anchor="middle" font-size="15" fill="#065f46">현금영수증(5342) 발급</text>

                  <!-- Consumer2 이벤트 -->
                  <line x1="560" y1="375" x2="560" y2="680" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="2 4" opacity="0.7"></line>
                  <line x1="560" y1="678" x2="560" y2="680" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>
                  <rect x="450" y="680" width="220" height="90" rx="14" fill="url(#cf-grad-warn)" stroke="#dc2626" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <circle cx="470" cy="700" r="6" fill="#dc2626"></circle>
                  <line x1="466" y1="696" x2="474" y2="704" stroke="white" stroke-width="1.5"></line>
                  <line x1="474" y1="696" x2="466" y2="704" stroke="white" stroke-width="1.5"></line>
                  <text x="575" y="708" text-anchor="middle" font-size="15" fill="#991b1b">상품 2번 취소요청 입력</text>
                  <text x="572" y="735" text-anchor="middle" font-size="15" fill="#991b1b">직전 현금영수증(5342)</text>
                  <text x="572" y="753" text-anchor="middle" font-size="15" fill="#991b1b">취소</text>

                  <line x1="560" y1="770" x2="560" y2="880" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>
                  <rect x="450" y="880" width="220" height="90" rx="14" fill="url(#cf-grad-success)" stroke="#059669" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <circle cx="470" cy="900" r="6" fill="#059669"></circle>
                  <path d="M 466 900 L 469 903 L 474 898" stroke="white" stroke-width="1.5" fill="none" />
                  <text x="572" y="908" text-anchor="middle" font-size="15" fill="#065f46">상품 1, 2번을 제외한</text>
                  <text x="572" y="935" text-anchor="middle" font-size="15" fill="#065f46">나머지 금액 발급</text>
                  <text x="572" y="953" text-anchor="middle" font-size="15" fill="#065f46">현금영수증(5343) 발급</text>

                  <!-- Consumer3 이벤트 -->
                  <line x1="870" y1="375" x2="870" y2="780" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="2 4" opacity="0.7"></line>
                  <line x1="870" y1="778" x2="870" y2="780" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#cf-arrow)"></line>
                  <rect x="760" y="780" width="220" height="90" rx="14" fill="url(#cf-grad-warn)" stroke="#dc2626" stroke-width="1.2" filter="url(#cf-shadow)" />
                  <circle cx="780" cy="800" r="6" fill="#dc2626"></circle>
                  <line x1="776" y1="796" x2="784" y2="804" stroke="white" stroke-width="1.5"></line>
                  <line x1="784" y1="796" x2="776" y2="804" stroke="white" stroke-width="1.5"></line>
                  <text x="884" y="808" text-anchor="middle" font-size="15" fill="#991b1b">상품 3번 취소요청 입력</text>
                  <text x="881" y="835" text-anchor="middle" font-size="15" fill="#991b1b">직전 현금영수증(5342)</text>
                  <text x="881" y="853" text-anchor="middle" font-size="15" fill="#991b1b">취소</text>

                  <!-- 경합 발생 (강조 — conflict 그라디언트 + 강한 그림자) -->
                  <path d="M 670 725 L 715 725 L 715 825 L 760 825" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cf-arrow-red)" />
                  <rect x="672" y="745" width="124" height="34" rx="10" fill="url(#cf-grad-conflict)" stroke="#dc2626" stroke-width="1.6" filter="url(#cf-shadow-strong)" />
                  <text x="734" y="768" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">⚠ 동일 5342 경합</text>

                  <!-- 오류 메시지 -->
                  <line x1="870" y1="870" x2="870" y2="990" stroke="#dc2626" stroke-width="1.6" marker-end="url(#cf-arrow-red)"></line>
                  <rect x="730" y="995" width="280" height="50" rx="12" fill="url(#cf-grad-warn)" stroke="#dc2626" stroke-width="1.5" filter="url(#cf-shadow-strong)" />
                  <polygon points="755,1025 770,1025 762.5,1010" fill="#dc2626"></polygon>
                  <text x="762.5" y="1028" text-anchor="middle" font-size="14" font-weight="700" fill="white">!</text>
                  <text x="892" y="1025" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">이미 기처리된 요청입니다 오류</text>
                </svg>